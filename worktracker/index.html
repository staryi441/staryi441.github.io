<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkTracker — Трекер Смен</title>
    <style>
        body {
            background-color: #000000;
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .back-link {
            align-self: flex-start;
            color: #00E5FF;
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .app-card {
            max-width: 500px;
            width: 100%;
            background-color: #121212;
            border: 1px solid #222222;
            border-radius: 24px;
            padding: 32px;
            box-sizing: border-box;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            margin: 0 0 6px 0;
        }

        .version {
            color: #888888;
            font-size: 14px;
            margin-bottom: 24px;
        }

        /* Сетка фич */
        .features {
            text-align: left;
            margin: 24px 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            color: #E0E0E0;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .dot.blue { background-color: #00E5FF; }
        .dot.green { background-color: #00E676; }
        .dot.red { background-color: #FFFF1744; }

        /* Кнопка скачивания APK */
        .download-btn {
            display: block;
            background-color: #00E5FF;
            color: #000000;
            text-decoration: none;
            font-weight: 700;
            padding: 16px;
            border-radius: 12px;
            margin-top: 24px;
            transition: opacity 0.2s ease;
        }

        .download-btn:hover {
            opacity: 0.9;
        }

        .source-btn {
            display: block;
            color: #888888;
            text-decoration: none;
            font-size: 14px;
            margin-top: 16px;
        }
        .source-btn:hover { color: #FFFFFF; }
    </style>
</head>
<body>

    <a href="../" class="back-link">← Назад к хабу</a>

    <div class="app-card">
        <h1>WorkTracker</h1>
        <div class="version">v2.0 • Android App</div>

        <div class="features">
            <div class="feature-item">
                <span class="dot blue"></span>
                <span>Чистый чистый AMOLED интерфейс</span>
            </div>
            <div class="feature-item">
                <span class="dot green"></span>
                <span>Автоматическая генерация смен вперёд (3/2, 5/2, кастом)</span>
            </div>
            <div class="feature-item">
                <span class="dot green"></span>
                <span>Расчет зарплаты (фикса или почасовая ставка)</span>
            </div>
            <div class="feature-item">
                <span class="dot red"></span>
                <span>Встроенные фото-заметки к дням через Room архитектуру</span>
            </div>
        </div>

        <a href="https://github.com/staryi441/worktracker/releases/latest" class="download-btn" target="_blank">
            Скачать APK
        </a>

        <a href="https://github.com/staryi441" class="source-btn" target="_blank">Исходный код на GitHub</a>
    </div>

</body>
</html>
