<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Страница не найдена</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        body {
            background-color: #000000;
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .error-container {
            animation: fadeIn 0.4s ease-out forwards;
        }
        h1 { font-size: 64px; margin: 0; color: #FF1744; }
        p { color: #888888; font-size: 16px; margin: 12px 0 24px 0; }
        a {
            color: #8B00FF;
            text-decoration: none;
            border: 1px solid #8B00FF;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            transition: background 0.2s, color 0.2s;
        }
        a:hover { background: rgba(139, 0, 255, 0.15); }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>404</h1>
        <p>Кажется, этой страницы не существует или проект был перенесен.</p>
        <a href="https://staryi441.github.io">Вернуться в Хаб</a>
    </div>
</body>
</html>
